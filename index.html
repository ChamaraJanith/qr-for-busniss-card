<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact QR Generator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="glass-panel">
            <h1>vCard QR Generator</h1>
            <p>Fill in the details to generate a scan-to-save QR code.</p>
            
            <form id="vcard-form">
                <div class="input-group">
                    <input type="text" id="firstName" placeholder="First Name" required>
                    <input type="text" id="lastName" placeholder="Last Name" required>
                </div>
                
                <div class="input-group">
                    <input type="tel" id="phone" placeholder="Phone Number" required>
                </div>
                
                <div class="input-group">
                    <input type="email" id="email" placeholder="Email Address">
                </div>
                
                <div class="input-group">
                    <input type="text" id="company" placeholder="Company">
                </div>
                
                <div class="input-group">
                    <input type="text" id="jobTitle" placeholder="Job Title">
                </div>

                <div class="input-group">
                    <input type="url" id="photoUrl" placeholder="Profile Picture URL (e.g. GitHub Pages Image Link)">
                </div>

                <div style="display: flex; gap: 10px; margin-top: 8px;">
                    <button type="submit" class="generate-btn" style="flex: 1;">Generate QR Code</button>
                    <button type="button" id="download-vcf-btn" class="generate-btn" style="flex: 1; background: #8b5cf6;">Download .vcf</button>
                </div>
            </form>
            
            <div id="qr-container" class="hidden">
                <div id="qrcode"></div>
                <p class="scan-text">Scan with your phone to add contact!</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
